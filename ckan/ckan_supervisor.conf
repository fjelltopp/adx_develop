

[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ===============================
; ckan harvester
; ===============================
[program:ckan_gather_consumer]

command=%(ENV_CKAN_VENV)s/bin/ckan --config=%(ENV_CONFIG)s harvester gather-consumer

; user that owns virtual environment.
user=root

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true

[program:ckan_fetch_consumer]

command=%(ENV_CKAN_VENV)s/bin/ckan --config=%(ENV_CONFIG)s harvester fetch-consumer

; user that owns virtual environment.
user=root

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true

[program:ckan_harvester_run]

command=/bin/bash -c "sleep 2m && %(ENV_CKAN_VENV)s/bin/ckan --config=%(ENV_CONFIG)s harvester run "
; user that owns virtual environment.
user=root

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true

; =======================================================
; Supervisor configuration for CKAN background job worker
; =======================================================

[program:ckan-worker]

; Use the full paths to the virtualenv and your configuration file here.
command=%(ENV_CKAN_VENV)s/bin/ckan -c %(ENV_CONFIG)s jobs worker


; User the worker runs as.
user=ckan


; Start just a single worker. Increase this number if you have many or
; particularly long running background jobs.
numprocs=1
process_name=%(program_name)s-%(process_num)02d


; Log files.
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Make sure that the worker is started on system start and automatically
; restarted if it crashes unexpectedly.
autostart=true
autorestart=true


; Number of seconds the process has to run before it is considered to have
; started successfully.
startsecs=10

; Need to wait for currently executing tasks to finish at shutdown.
; Increase this if you have very long running tasks.
stopwaitsecs = 600

; ===============================
; nginx reverse proxy
; ===============================
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
priority=10

; ===============================
; uWSGI CKAN application
; ===============================
[program:uwsgi]
command=/usr/local/bin/uwsgi --ini /usr/lib/adx/uwsgi.ini
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
priority=20
