name: Build and Deploy CKAN (staging)

on:
  push:
    branches: [main]
  pull_request:
    # Runs the test job only (build/deploy are gated off pull_request below),
    # so PRs get a visible test status check without deploying.
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g., sha-abc1234). Leave blank to build from the workflow's ref."
        required: false
        type: string

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_NAME: adracr
  IMAGE_NAME: ckan
  NAMESPACE: adr-s
  URL: https://dev-adr.unaids.org

jobs:
  test:
    name: Extension tests
    # Skip on a pure redeploy (workflow_dispatch with an existing image_tag);
    # that image was already tested when it was built.
    if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Fresh runner DB — no need to restart the db container during testsetup.
      SKIP_DB_RESTART: "True"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      # The dominant cost is `pipenv sync --dev` at bootstrap (CKAN + ~19
      # extensions), which lands in the bind-mounted .adxvenv. Caching it on
      # Pipfile.lock makes warm runs a near no-op. .adxvenv is gitignored and
      # written by root in-container, so there are no ownership issues here.
      # Restore + save are split (rather than the combined cache action) so the
      # venv is saved even when the test step fails — otherwise the expensive
      # `pipenv sync` is repeated cold on every triage run. Saved at job end.
      - name: Restore Python venv
        id: venv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .adxvenv
          key: adxvenv-${{ runner.os }}-${{ hashFiles('Pipfile.lock') }}
          restore-keys: |
            adxvenv-${{ runner.os }}-

      # Second cost: the entrypoint runs `yarn install` + build for the unaids
      # React app on every boot. Cache its node_modules on the React yarn.lock.
      - name: Restore unaids React node_modules
        id: react-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: submodules/ckanext-unaids/ckanext/unaids/react/node_modules
          key: react-nm-${{ runner.os }}-${{ hashFiles('submodules/ckanext-unaids/ckanext/unaids/react/yarn.lock') }}
          restore-keys: |
            react-nm-${{ runner.os }}-

      - name: Prepare .env
        run: cp dev.env .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Pre-build every service image the dev stack builds, with GHA layer
      # caching, so their apt/pip/node install layers survive across runs
      # (`./adx build` below then just picks up the already-built images
      # from the local daemon instead of rebuilding from scratch). `ckan`
      # covers `supervisor` too - same image. Independent images, so they
      # run as parallel steps against the same Buildx builder instead of
      # one at a time.
      - parallel:
          - name: Build ckan dev image (cached)
            uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6.10.0
            with:
              context: ./ckan
              file: ./ckan/Dockerfile
              load: true
              cache-from: type=gha,scope=dev-ckan-image
              cache-to: type=gha,mode=max,scope=dev-ckan-image
              tags: ghcr.io/fjelltopp/adx_develop/ckan_base:development

          - name: Build db dev image (cached)
            uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6.10.0
            with:
              context: ./db
              file: ./db/Dockerfile
              load: true
              build-args: |
                DS_RO_PASS=datastore
                POSTGRES_PASSWORD=ckan
              cache-from: type=gha,scope=dev-db-image
              cache-to: type=gha,mode=max,scope=dev-db-image
              tags: adr.db:development

          - name: Build solr dev image (cached)
            uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6.10.0
            with:
              context: ./solr
              file: ./solr/Dockerfile
              load: true
              cache-from: type=gha,scope=dev-solr-image
              cache-to: type=gha,mode=max,scope=dev-solr-image
              tags: adr.solr:development

          - name: Build cron dev image (cached)
            uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6.10.0
            with:
              context: ./cron
              load: true
              cache-from: type=gha,scope=dev-cron-image
              cache-to: type=gha,mode=max,scope=dev-cron-image
              tags: adr.cron:development

          - name: Build datapusher dev image (cached)
            uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6.10.0
            with:
              context: ./submodules/datapusher
              load: true
              cache-from: type=gha,scope=dev-datapusher-image
              cache-to: type=gha,mode=max,scope=dev-datapusher-image
              tags: adr.datapusher:development

          - name: Build giftless dev image (cached)
            uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6.10.0
            with:
              context: ./submodules/giftless/
              file: ./submodules/giftless/Dockerfile
              load: true
              cache-from: type=gha,scope=dev-giftless-image
              cache-to: type=gha,mode=max,scope=dev-giftless-image
              tags: adr.giftless:development

      - name: Build images and start the dev stack
        run: |
          ./adx build
          ./adx up

      - name: Wait for CKAN bootstrap
        run: |
          for i in $(seq 1 90); do
            if docker logs ckan 2>&1 | grep -q 'CKAN bootstrapping finished, environment ready'; then
              echo "CKAN ready after ${i} checks"
              exit 0
            fi
            echo "Waiting for CKAN bootstrap (${i}/90)…"
            sleep 10
          done
          echo "::error::CKAN did not finish bootstrapping in time"
          docker logs ckan
          exit 1

      - name: Create test databases
        run: ./adx testsetup

      - name: Run extension tests
        run: |
          # Run every suite (don't fail-fast) so one run shows the full picture,
          # then fail at the end if any suite failed.
          failed=()
          for ext in unaids validation scheming dhis2harvester emailasusername; do
            echo "::group::ckanext-${ext}"
            if ./adx test "${ext}" --no-interaction; then
              echo "ckanext-${ext}: PASS"
            else
              echo "ckanext-${ext}: FAIL"
              failed+=("${ext}")
            fi
            echo "::endgroup::"
          done
          echo "--- summary ---"
          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::Failing suites: ${failed[*]}"
            exit 1
          fi
          echo "All extension suites passed"

      - name: Dump CKAN logs on failure
        if: failure()
        run: docker logs ckan || true

      - name: Save Python venv
        if: always() && steps.venv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .adxvenv
          key: ${{ steps.venv-cache.outputs.cache-primary-key }}

      - name: Save unaids React node_modules
        if: always() && steps.react-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: submodules/ckanext-unaids/ckanext/unaids/react/node_modules
          key: ${{ steps.react-cache.outputs.cache-primary-key }}

  build:
    # Runs in parallel with `test` (image isn't pushed here, so there's
    # nothing to gate on tests passing yet) - just not on a pure redeploy
    # (workflow_dispatch with an existing image_tag), and not on pull_request
    # (no image needed until it's actually going to staging).
    if: >-
      github.event_name != 'pull_request'
      && (github.event_name != 'workflow_dispatch' || inputs.image_tag == '')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6.10.0
        with:
          context: .
          file: deploy/Dockerfile.prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  push:
    name: Push image
    needs: [test, build]
    # Only push once tests have actually passed (or were skipped as a pure
    # redeploy, in which case build itself was skipped and this is too).
    if: >-
      always()
      && github.event_name != 'pull_request'
      && needs.test.result != 'failure'
      && needs.test.result != 'cancelled'
      && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ACR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Same context/cache-from as the `build` job's step - this is a full
      # cache hit (nothing to rebuild), it just uploads and pushes the
      # already-built layers now that tests have passed.
      - name: Push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile.prod
          push: true
          cache-from: type=gha
          tags: ${{ needs.build.outputs.tags }}
          labels: ${{ needs.build.outputs.labels }}

  deploy:
    needs: [test, build, push]
    # Never deploy if tests failed/cancelled. Otherwise deploy when the image
    # was pushed (success) or already exists (build/push skipped on redeploy).
    if: >-
      always()
      && github.event_name != 'pull_request'
      && needs.test.result != 'failure'
      && needs.test.result != 'cancelled'
      && (needs.push.result == 'success' || needs.push.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ env.URL }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve image tag
        id: params
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            echo "image_tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "image_tag=${{ needs.build.outputs.image_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to AKS
        run: |
          kubectl create configmap ckan-env-config \
            --from-file=env.ini=deploy/staging.ini \
            -n ${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl set image deployment/ckan \
            ckan=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.params.outputs.image_tag }} \
            -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/ckan -n ${{ env.NAMESPACE }} --timeout=20m
